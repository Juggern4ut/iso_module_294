<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>05 - Async - Lösungen</title>

    <style>
        * {
            font-family: monospace;
            list-style: none;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>

    <script>

        // Aufgabe 2
        console.log("Ausgabe 1");
        console.log("Ausgabe 2");

        setTimeout(() => {
            console.log("Ausgabe 3");
        }, 1000);

        console.log("Ausgabe 4");


        // Aufgabe 3 
        const p3 = new Promise((resolve, reject) => {
            setTimeout(() => {
                resolve("Promise erfüllt");
            }, 1000);
        });

        p3.then(res => {
            console.log(res);
        });


        // Aufgabe 4
        const p4 = new Promise((resolve, reject) => {
            setTimeout(() => {
                resolve("Promise erfüllt");
            }, 1000);
        });

        p4.then(res => {
            console.log(res);
        }).catch(err => {
            console.log(`Folgender Fehler ist aufgetreten: ${err}`);
        });


        // Aufgabe 5
        async function ladeDaten() {
            return "Daten geladen!";
        }

        const result5 = ladeDaten();
        console.log(result5);


        // Aufgabe 6 
        async function return42() {
            const p6 = new Promise((resolve, reject) => {
                setTimeout(() => {
                    resolve(42);
                }, 2000);
            });

            const result6 = await p6;
            console.log(result6);
        }

        return42();


        // Aufgabe 7
        async function return42_2() {
            const p7 = new Promise((resolve, reject) => {
                const shouldFail = true;
                setTimeout(() => {
                    if (shouldFail) {
                        reject("Error 123 occured");
                    } else {
                        resolve(42);
                    }
                }, 2000);
            });

            try {
                const result7 = await p7;
                console.log(result7);
            } catch (error) {
                console.log(error);
            }
        }

        return42_2();

    </script>
</body>

</html>
