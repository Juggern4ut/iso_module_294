<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>06 - Fetch - Lösungen</title>
    <link href="css/style.css" rel="stylesheet">

    <style>
        .completed {
            color: #0c0;
        }

        .not-completed {
            color: #c00;
        }
    </style>
</head>

<body>

    <button id="done">Nur abgeschlossene Todos anzeigen</button><br />
    <button id="not-done">Nur offene Todos anzeigen</button><br />
    <button id="all">Alle Todos anzeigen</button>

    <h2>Liste der Todos</h2>

    <ul id="todos">
    </ul>

    <script>


        // Aufgabe 2
        fetch("https://jsonplaceholder.typicode.com/posts")
            .then(res => {
                return res.json();
            })
            .then(data => {
                console.warn("Aufgabe 2");
                console.log(data);
            });


        // Aufgabe 3
        async function loadPosts() {
            const res = await fetch("https://jsonplaceholder.typicode.com/posts");
            const data = await res.json();
            console.warn("Aufgabe 3");
            console.log(data);
        }
        loadPosts();


        // Aufgabe 4
        async function loadPosts2() {
            const res = await fetch("https://jsonplaceholder.typicode.com/posts");
            console.warn("Aufgabe 4");
            console.log(`Statuscode: ${res.status}`);

            if (res.ok) {
                const data = await res.json();
                console.log(data);
            } else {
                throw new Error('Es ist ein Fehler aufgetreten');
            }
        }
        loadPosts2();


        // Aufgabe 5
        async function loadPosts3() {
            try {
                const res = await fetch("https://jsonplaceholder.typicode.com/posts");
                console.warn("Aufgabe 5");
                console.log(`Statuscode: ${res.status}`);

                if (res.ok) {
                    const data = await res.json();
                    console.log(data);
                } else {
                    throw new Error('Es ist ein Fehler aufgetreten');
                }
            } catch (err) {
                console.error(err);
            }
        }
        loadPosts3();


        // Aufgabe 6
        async function loadTodos() {
            try {
                const res = await fetch("https://jsonplaceholder.typicode.com/todos/");
                const data = await res.json();

                const list = document.getElementById("todos");
                data.forEach(todo => {
                    const element = document.createElement("li");
                    element.classList.add(todo.completed ? "completed" : "not-completed");
                    element.innerHTML = `[${todo.completed ? 'X' : '&nbsp;'}] ${todo.title}`;
                    list.append(element);
                });
            } catch (err) {
                console.error(err);
            }
        }

        //loadTodos();

        // Aufgabe 7 + 8
        async function loadTodosWithUsers() {
            try {
                const res = await fetch("https://jsonplaceholder.typicode.com/todos/");
                const data = await res.json();

                const res2 = await fetch("https://jsonplaceholder.typicode.com/users/");
                const users = await res2.json();

                const list = document.getElementById("todos");
                data.forEach(todo => {
                    const element = document.createElement("li");
                    element.classList.add(todo.completed ? "completed" : "not-completed");

                    const taskUser = users.find(u => u.id == todo.userId);
                    element.innerHTML = `[${todo.completed ? 'X' : '&nbsp;'}] ${todo.title} - ${taskUser.name}`;

                    list.append(element);
                });
            } catch (err) {
                console.error(err);
            }
        }

        loadTodosWithUsers();

        // Aufgabe 9
        const showDoneButton = document.getElementById("done");
        const showNotDoneButton = document.getElementById("not-done");
        const showAll = document.getElementById("all");

        showDoneButton.addEventListener("click", () => {
            showAllTasks();
            const notDoneTasks = document.querySelectorAll(".not-completed");
            notDoneTasks.forEach(t => t.style.display = "none");
        });

        showNotDoneButton.addEventListener("click", () => {
            showAllTasks();
            const doneTasks = document.querySelectorAll(".completed");
            doneTasks.forEach(t => t.style.display = "none");
        });

        showAll.addEventListener("click", () => {
            showAllTasks()
        });

        const showAllTasks = () => {
            const allTasks = document.querySelectorAll("#todos li");
            allTasks.forEach(t => t.style.display = "block");
        };


        // Aufgabe 10
        fetch(
            "https://jsonplaceholder.typicode.com/posts",
            {
                method: 'POST'
            }
        )
            .then(res => {
                return res.json();
            })
            .then(data => {
                console.warn("Aufgabe 10");
                console.log(data);
            });


        // Aufgabe 11
        fetch(
            "https://jsonplaceholder.typicode.com/posts",
            {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            }
        )
            .then(res => {
                return res.json();
            })
            .then(data => {
                console.warn("Aufgabe 11");
                console.log(data);
            });

        // Aufgabe 12
        const todo = {
            "title": "Der Titel für meinen Post",
            "body": "Das ist der Inhalt meines Posts, hier kommt irgend ein langer Text rein",
            "userId": 123
        }

        // Aufgabe 13
        fetch(
            "https://jsonplaceholder.typicode.com/posts",
            {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(todo)
            }
        )
            .then(res => {
                return res.json();
            })
            .then(data => {
                console.warn("Aufgabe 13");
                console.log(data);
            });


        // Aufgabe 14 + 15
        async function createPost() {
            const response = await fetch(
                "https://jsonplaceholder.typicode.com/posts",
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(todo)
                }
            )
            const data = await response.json();
            console.warn("Aufgabe 14");
            console.log(data);
        }

    </script>
</body>

</html>
